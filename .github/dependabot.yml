version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7
    groups:
      babel:
        patterns:
          - "@babel/*"
    ignore:
      # https://github.com/mozilla/eslint-plugin-amo/issues/557
      - dependency-name: eslint
        versions:
          - ">= 10"
    allow:
      - dependency-type: "development"
        update-types:
          # Let's ignore "semver-patch" releases for dev dependencies to reduce
          # the amount of PRs we get every day.
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      ssdlc-actions:
        patterns:
          - "mozilla/ssdlc-actions/*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
